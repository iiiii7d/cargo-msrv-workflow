on:
  workflow_call:
    inputs:
      upgrade-branch-title:
        type: string
        default: Run `cargo-msrv`
      upgrade-branch-name:
        type: string
        default: cargo-msrv
      working-directory:
        type: string
        default: "."
      commit-message:
        type: string
        default: run cargo-msrv
      check-cmd:
        type: string
        default: cargo check --release --no-default-features

jobs:
  run-cargo-msrv:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        env:
          # renovate: datasource=rust-version depName=rust
          RUST_VERSION: 1.99.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: cargo-bins/cargo-binstall@c06f6a0003f7c6165a00c89d1697731c9e8a5c72 # v1.25.2
      - run: cargo binstall --force cargo-msrv@${{ env.CARGO_MSRV_VERSION }}
        env:
          # renovate: datasource=crate depName=cargo-msrv versioning=loose
          CARGO_MSRV_VERSION: 0.20.0-beta.2
          
      - run: sed -i '/^rust-version/d' Cargo.toml
          
      - run: cargo msrv find --write-msrv --ignore-lockfile -- ${{ inputs.check-cmd }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-toml
          path: ${{ inputs.working-directory }}/Cargo.toml

  create-pull-request:
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    needs: run-cargo-msrv

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-toml
          path: ${{ inputs.working-directory }}

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: ${{ inputs.commit-message }}
          title: ${{ inputs.upgrade-branch-title }} (${{ github.ref_name }})
          branch: ${{ inputs.upgrade-branch-name }}/${{ github.ref_name }} 
          delete-branch: true
