on:
  workflow_call:
    inputs:
      upgrade-branch-title:
        type: string
        default: Run `cargo-msrv`
      upgrade-branch-name:
        type: string
        default: cargo-msrv
      working-directory:
        type: string
        default: "."
      commit-message:
        type: string
        default: run cargo-msrv
      check-cmd:
        type: string
        default: cargo check --release --no-default-features

jobs:
  run-cargo-msrv:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        env:
          # renovate: datasource=rust-version depName=rust
          RUST_VERSION: 1.99.1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2
      - run: cargo binstall --force cargo-msrv@${{ env.CARGO_MSRV_VERSION }}
        env:
          # renovate: datasource=crate depName=cargo-msrv versioning=loose
          CARGO_MSRV_VERSION: 0.20.0-beta.5
          
      - run: sed -i '/^rust-version/d' Cargo.toml
          
      - run: cargo msrv find --write-msrv --ignore-lockfile -- ${{ inputs.check-cmd }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-toml
          path: ${{ inputs.working-directory }}/Cargo.toml

  create-pull-request:
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    needs: run-cargo-msrv

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-toml
          path: ${{ inputs.working-directory }}

      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: ${{ inputs.commit-message }}
          title: ${{ inputs.upgrade-branch-title }} (${{ github.ref_name }})
          branch: ${{ inputs.upgrade-branch-name }}/${{ github.ref_name }} 
          delete-branch: true
